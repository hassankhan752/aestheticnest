{% extends 'base.html' %}
{% block title %}Customer sign in — Aesthetic Nest{% endblock %}
{% block content %}
<section class="admin-auth">
  <a class="brand" href="{{ url_for('main.home') }}"><span class="brand-mark">an</span><span>Aesthetic <b>Nest</b><small>YOUR ACCOUNT</small></span></a>
  <p class="eyebrow">Welcome home</p>
  <h1>Sign in to <em>your account.</em></h1>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button button-dark button-wide" type="submit">Sign in</button>
  </form>
  <p class="auth-note">New to Aesthetic Nest? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
